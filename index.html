<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#dff1ff">
<title>Login — SMP Negeri 10 Satui</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  font-family:Arial,Helvetica,sans-serif;
  background:linear-gradient(180deg,#dff3ff,#f5fbff,#fff);
  color:#183247;
}

.login-box{
  width:100%;
  max-width:390px;
  background:rgba(255,255,255,.95);
  border:1px solid #d7eaf7;
  border-radius:28px;
  padding:30px 24px;
  box-shadow:0 15px 40px rgba(52,110,150,.13);
}

.logo{
  width:64px;
  height:64px;
  margin:0 auto 18px;
  border-radius:20px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  background:linear-gradient(145deg,#83c9f4,#3c8ec7);
  color:white;
  font-size:14px;
  font-weight:900;
  line-height:1.1;
}

h1{
  text-align:center;
  font-size:22px;
}

.subtitle{
  text-align:center;
  color:#6d8292;
  font-size:13px;
  margin-top:7px;
  margin-bottom:28px;
}

label{
  display:block;
  font-size:13px;
  font-weight:bold;
  margin-bottom:8px;
}

input{
  width:100%;
  padding:14px 15px;
  border:1px solid #d7eaf7;
  border-radius:14px;
  outline:none;
  background:#fafdff;
  color:#183247;
}

input:focus{
  border-color:#70b7e5;
}

button{
  width:100%;
  margin-top:15px;
  padding:14px;
  border:0;
  border-radius:14px;
  background:#5ca9df;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

button:active{
  transform:scale(.98);
}

.error{
  display:none;
  margin-top:12px;
  padding:10px;
  border-radius:10px;
  background:#fff0f0;
  color:#c33;
  text-align:center;
  font-size:12px;
}

.info{
  margin-top:22px;
  text-align:center;
  color:#8a9aa6;
  font-size:11px;
  line-height:1.5;
}
</style>
</head>

<body>

<div class="login-box">

  <div class="logo">
    SMP<br>10
  </div>

  <h1>SMP Negeri 10 Satui</h1>

  <p class="subtitle">
    Portal Siswa
  </p>

  <label for="password">Kata sandi</label>

  <input
    id="password"
    type="password"
    placeholder="Masukkan kata sandi"
    autocomplete="off"
    onkeydown="if(event.key==='Enter') login()"
  >

  <button onclick="login()">
    Masuk
  </button>

  <div id="error" class="error">
    Kata sandi salah.
  </div>

  <p class="info">
    Portal informasi dan kegiatan siswa<br>
    SMP Negeri 10 Satui
  </p>

</div>

<script>

const PASSWORD = "smp10satui";

function login(){

  const password =
    document.getElementById("password").value;

  const error =
    document.getElementById("error");

  if(password === PASSWORD){

    window.location.href = "home.html";

  }else{

    error.style.display = "block";

    document.getElementById("password").value = "";

  }
}

</script>

</body>
</html>
